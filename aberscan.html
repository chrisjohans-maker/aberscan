<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#110E0C">
<title>AberScan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sans:'DM Sans',sans-serif;--mono:'Space Mono',monospace;--accent:#8B2942;--al:#A83355;--bg:#110E0C;--text:#F5F0EB;--muted:#8B7B72;--dim:#6B5E55}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
@keyframes scanLine{0%{top:0}100%{top:calc(100% - 2px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useRef,useCallback,useEffect}=React;

const APP_VERSION='8.3.0';
(()=>{const s=localStorage.getItem('aberscan_version');if(s&&s!==APP_VERSION){localStorage.setItem('aberscan_version',APP_VERSION);if(typeof caches!=='undefined')caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));window.location.reload(true);return;}localStorage.setItem('aberscan_version',APP_VERSION);})();

function getApiKey(){return localStorage.getItem('aberscan_api_key');}
function setApiKey(k){localStorage.setItem('aberscan_api_key',k);}
function clearApiKey(){localStorage.removeItem('aberscan_api_key');}

const VOLUME_TIERS={high:{label:"High",par:24,color:"#E24B4A",bg:"#FCEBEB"},med:{label:"Med",par:12,color:"#BA7517",bg:"#FAEEDA"},low:{label:"Low",par:6,color:"#0F6E56",bg:"#E1F5EE"}};
const STOCK_LEVELS={low:{label:"Restock",color:"#E24B4A",bg:"rgba(226,75,74,0.08)",border:"#E24B4A"},getting_low:{label:"Low",color:"#BA7517",bg:"rgba(186,117,23,0.08)",border:"#EF9F27"},good:{label:"Good",color:"#639922",bg:"rgba(99,153,34,0.08)",border:"#97C459"}};
function getStockLevel(count,par){if(!par)return"good";const p=count/par;return p<=0.25?"low":p<=0.5?"getting_low":"good";}
function findPar(name,list){if(!name)return null;const n=name.toLowerCase();return list.find(p=>n.includes(p.name.toLowerCase())||p.name.toLowerCase().includes(n))||null;}

const PARENT_COMPANIES={
  "diageo":["johnnie walker","smirnoff","captain morgan","tanqueray","ketel one","don julio","crown royal","baileys","bulleit","casamigos","guinness","ciroc","buchanan's","singleton","talisker","lagavulin","oban"],
  "brown-forman":["jack daniel's","jack daniels","woodford reserve","old forester","herradura","el jimador","finlandia","gentleman jack","coopers craft"],
  "pernod ricard":["absolut","jameson","malibu","kahlua","beefeater","glenlivet","aberlour","avion","altos","redbreast","powers","monkey 47","lillet"],
  "beam suntory":["jim beam","maker's mark","makers mark","knob creek","basil hayden","hornitos","sauza","midori","laphroaig","hibiki","roku","sipsmith","courvoisier"],
  "bacardi":["bacardi","grey goose","patron","patrón","bombay sapphire","bombay","dewar's","dewars","st-germain","st germain","cazadores","banks"],
  "campari group":["campari","aperol","wild turkey","grand marnier","skyy","espolon","espolòn","appleton","wray & nephew"],
  "sazerac":["buffalo trace","pappy van winkle","fireball","southern comfort","sazerac","blanton's","blantons","eagle rare","weller","eh taylor"],
  "fifth generation":["tito's","titos"],
  "constellation brands":["casa noble","mi campo","svedka","high west"],
  "william grant & sons":["glenfiddich","hendrick's","hendricks","balvenie","monkey shoulder","sailor jerry","tullamore dew"],
  "edrington":["macallan","highland park","famous grouse","brugal"],
  "moët hennessy":["hennessy","belvedere","glenmorangie","ardbeg","woodinville"],
  "remy cointreau":["remy martin","rémy martin","cointreau","mount gay","the botanist","bruichladdich"],
};
function getParentCompany(brand){
  const b=brand.toLowerCase();
  for(const[parent,brands]of Object.entries(PARENT_COMPANIES)){
    if(brands.some(pb=>b.includes(pb)||pb.includes(b)))return parent;
  }
  return"independent/other";
}
function calcShelfShare(allBrands){
  const companies={};
  allBrands.forEach(b=>{
    const parent=getParentCompany(b);
    if(!companies[parent])companies[parent]={count:0,brands:[]};
    companies[parent].count++;
    companies[parent].brands.push(b);
  });
  const total=allBrands.length||1;
  return Object.entries(companies).map(([name,data])=>({name:name.split(" ").map(w=>w[0].toUpperCase()+w.slice(1)).join(" "),count:data.count,pct:Math.round((data.count/total)*100),brands:data.brands})).sort((a,b)=>b.count-a.count);
}
function getParList(){try{return JSON.parse(localStorage.getItem('aberscan_pars'))||[];}catch{return[];}}
function saveParList(list){localStorage.setItem('aberscan_pars',JSON.stringify(list));}
function getCounts(){try{return JSON.parse(localStorage.getItem('aberscan_counts'))||{};}catch{return{};}}
function saveCounts(c){localStorage.setItem('aberscan_counts',JSON.stringify(c));}

function App(){
  const scanRef=useRef(false);
  const fileRef=useRef(null);
  const[apiKey,setAK]=useState(getApiKey()||"");
  const[keyIn,setKeyIn]=useState("");
  const[scanning,setScanning]=useState(false);
  const[error,setError]=useState(null);
  const[tab,setTab]=useState("count");
  const[photos,setPhotos]=useState([]);
  const[parList,setParList]=useState(getParList());
  const[counts,setCounts]=useState(getCounts());
  const[adding,setAdding]=useState(false);
  const[newName,setNewName]=useState("");
  const[newVol,setNewVol]=useState("med");
  const[newPar,setNewPar]=useState("12");
  const[results,setResults]=useState(null);

  // Brand audit state
  const[brands,setBrands]=useState(()=>{try{return JSON.parse(localStorage.getItem('aberscan_brands'))||[];}catch{return[];}});
  const[addingBrand,setAddingBrand]=useState(false);
  const[brandName,setBrandName]=useState("");
  const[auditResults,setAuditResults]=useState(null);
  const[auditScanning,setAuditScanning]=useState(false);
  const auditFileRef=useRef(null);

  const saveBrands=(list)=>{setBrands(list);localStorage.setItem('aberscan_brands',JSON.stringify(list));};
  const addBrand=()=>{if(!brandName.trim()||brands.includes(brandName.trim()))return;saveBrands([...brands,brandName.trim()]);setBrandName("");setAddingBrand(false);};
  const removeBrand=(i)=>saveBrands(brands.filter((_,idx)=>idx!==i));

  const doAuditScan=useCallback((e)=>{
    const file=e.target.files?.[0];
    if(!file||brands.length===0)return;
    setAuditScanning(true);setAuditResults(null);setError(null);
    const reader=new FileReader();
    reader.onload=async()=>{
      const b64=reader.result.split(",")[1];
      const mediaType=file.type||"image/jpeg";
      try{
        const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":getApiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:b64}},
            {type:"text",text:`Look at this bar shelf photo. Identify EVERY brand/product visible on the shelf.\n\nI specifically need to know if these brands are present:\n${brands.map(b=>"- "+b).join("\n")}\n\nList ALL brands you can see, not just mine.\n\nJSON only, no markdown:\n{"found":[{"brand":"Tito's","notes":"top shelf"}],"not_found":["Smirnoff"],"all_brands":["Tito's","Jack Daniel's","Jameson","Crown Royal","Maker's Mark"]}`}
          ]}]})});
        if(!r.ok)throw new Error(`API ${r.status}`);
        const d=await r.json();const txt=(d.content||[]).map(c=>c.text||"").join("");
        let p=null;try{p=JSON.parse(txt.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim());}catch{}
        if(!p){let s=-1,dep=0,en=-1;for(let i=0;i<txt.length;i++){if(txt[i]==='{'){if(dep===0)s=i;dep++;}else if(txt[i]==='}'){dep--;if(dep===0&&s>=0){en=i;break;}}}if(s>=0&&en>s)try{p=JSON.parse(txt.substring(s,en+1));}catch{}}
        if(!p)throw new Error("Couldn't parse.");
        setAuditResults(p);
      }catch(e){console.error(e);setError(e.message||"Audit failed.");}
      finally{setAuditScanning(false);}
    };
    reader.readAsDataURL(file);
    e.target.value="";
  },[brands]);

  useEffect(()=>{saveCounts(counts);},[counts]);

  const addProduct=()=>{
    if(!newName.trim())return;
    const par=parseInt(newPar)||VOLUME_TIERS[newVol].par;
    const next=[...parList,{name:newName.trim(),volume:newVol,par}];
    setParList(next);saveParList(next);
    setNewName("");setNewVol("med");setNewPar("12");setAdding(false);
  };
  const removeProduct=(i)=>{const next=parList.filter((_,idx)=>idx!==i);setParList(next);saveParList(next);};

  // Multi-photo scan
  const addPhoto=useCallback((e)=>{
    const file=e.target.files?.[0];
    if(!file||photos.length>=6)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      const b64=dataUrl.split(",")[1];
      setPhotos(prev=>[...prev,{b64,mediaType:file.type||"image/jpeg",thumb:dataUrl}]);
    };
    reader.readAsDataURL(file);
    e.target.value="";
  },[photos.length]);

  const removePhoto=(i)=>setPhotos(prev=>prev.filter((_,idx)=>idx!==i));

  const processAllPhotos=useCallback(async()=>{
    if(photos.length===0||scanRef.current)return;
    scanRef.current=true;setScanning(true);setError(null);setResults(null);
    const content=[];
    photos.forEach(p=>{content.push({type:"image",source:{type:"base64",media_type:p.mediaType,data:p.b64}});});
    content.push({type:"text",text:`Count every item across ALL ${photos.length} images. Bar inventory scan — each image is a different fridge/shelf. Combine into one inventory.\n\nFor each product: name and total count. Group by category.\n\nCategories: Beer, Ciders, Seltzers, RTD/Cocktails, Wine, Spirits, Non-Alcoholic, Other\n\nCOUNTING: Count by TOPS — can tops, bottle caps, wine caps, bottle necks. Every visible top = 1 item. If 24 can tops in a group but only 3 readable labels, count all 24. Same product in multiple images = ADD counts.\n\nJSON only, no markdown:\n{"categories":[{"category":"Beer","items":[{"product":"Coors Light","count":24},{"product":"Modelo","count":20}]}],"total":44}`});
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":getApiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content}]})});
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(r.status===401?"Invalid API key.":r.status===429?"Rate limited.":e.error?.message||`Error ${r.status}`);}
      const d=await r.json();const txt=(d.content||[]).map(c=>c.text||"").join("");
      if(!txt.trim())throw new Error("Empty response.");
      let p=null;try{p=JSON.parse(txt.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim());}catch{}
      if(!p){let s=-1,dep=0,e=-1;for(let i=0;i<txt.length;i++){if(txt[i]==='{'){if(dep===0)s=i;dep++;}else if(txt[i]==='}'){dep--;if(dep===0&&s>=0){e=i;break;}}}if(s>=0&&e>s)try{p=JSON.parse(txt.substring(s,e+1));}catch{}}
      if(!p||!Array.isArray(p.categories))throw new Error("Couldn't parse results.");
      const cats=p.categories.map(g=>{const items=(g.items||[]).map(i=>({product:i.product||"Unknown",count:typeof i.count==="number"?i.count:parseInt(i.count)||0}));return{category:g.category||"Other",items,subtotal:items.reduce((s,i)=>s+i.count,0)};}).filter(g=>g.items.length>0);
      setResults({categories:cats,total:cats.reduce((s,g)=>s+g.subtotal,0)});
    }catch(e){console.error(e);setError(e.message||"Scan failed.");}
    finally{setScanning(false);scanRef.current=false;}
  },[photos]);

  const saveResultsToInventory=()=>{
    if(!results)return;
    const newCounts={...counts};
    results.categories.forEach(g=>{(g.items||[]).forEach(item=>{
      newCounts[item.product]=item.count;
      if(!parList.find(p=>p.name.toLowerCase()===item.product.toLowerCase())){
        const next=[...parList,{name:item.product,volume:"med",par:VOLUME_TIERS.med.par}];
        setParList(next);saveParList(next);
      }
    });});
    setCounts(newCounts);
    setResults(null);setPhotos([]);
    setTab("dashboard");
  };

  const shareText=()=>{
    const items=parList.map(p=>({...p,count:counts[p.name]||0}));
    const low=items.filter(i=>i.count>0&&getStockLevel(i.count,i.par)==="low");
    const gettingLow=items.filter(i=>i.count>0&&getStockLevel(i.count,i.par)==="getting_low");
    const good=items.filter(i=>i.count>0&&getStockLevel(i.count,i.par)==="good");
    const total=items.reduce((s,i)=>s+i.count,0);
    const now=new Date();
    const date=now.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    const time=now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    let text=`AberScan — ${date}, ${time}\n\n`;
    if(low.length>0){text+=`🔴 RESTOCK NOW\n`;low.forEach(i=>{text+=`  ${i.name} — ${i.count} (par ${i.par})\n`;});text+=`\n`;}
    if(gettingLow.length>0){text+=`🟡 GETTING LOW\n`;gettingLow.forEach(i=>{text+=`  ${i.name} — ${i.count} (par ${i.par})\n`;});text+=`\n`;}
    if(good.length>0){text+=`🟢 GOOD\n`;good.forEach(i=>{text+=`  ${i.name} — ${i.count} (par ${i.par})\n`;});text+=`\n`;}
    text+=`Total: ${total} items`;
    if(low.length>0)text+=` | ${low.length} need restock`;
    if(navigator.share){navigator.share({title:"AberScan Inventory",text}).catch(()=>{});}
    else{try{navigator.clipboard.writeText(text);alert("Copied");}catch{}}
  };

  // API Key screen
  if(!apiKey)return(
    <div style={S.root}><div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"0 24px"}}>
      <div style={{display:"flex",alignItems:"baseline",marginBottom:24}}><span style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:800,color:"#F5F0EB"}}>Aber</span><span style={{fontFamily:"var(--mono)",fontSize:21,fontWeight:700,color:"var(--al)"}}>Scan</span></div>
      <input type="password" value={keyIn} onChange={e=>setKeyIn(e.target.value)} placeholder="API key (sk-ant-...)" style={{width:"100%",maxWidth:320,padding:"14px 16px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,color:"var(--text)",fontFamily:"var(--mono)",fontSize:13,outline:"none",marginBottom:12}} onKeyDown={e=>{if(e.key==="Enter"&&keyIn.trim()){setApiKey(keyIn.trim());setAK(keyIn.trim());}}}/>
      <button onClick={()=>{if(keyIn.trim()){setApiKey(keyIn.trim());setAK(keyIn.trim());}}} style={{width:"100%",maxWidth:320,padding:"14px",background:"linear-gradient(135deg,var(--accent),var(--al))",border:"none",borderRadius:12,color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer",minHeight:48}}>Connect</button>
    </div></div>
  );

  return(
    <div style={S.root}>
      {/* Header */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"baseline"}}><span style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:800,color:"#F5F0EB"}}>Aber</span><span style={{fontFamily:"var(--mono)",fontSize:14,fontWeight:700,color:"var(--al)"}}>Scan</span></div>
        <button onClick={()=>{if(typeof caches!=='undefined')caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))));window.location.reload(true);}} style={{display:"flex",alignItems:"center",gap:4,background:"transparent",border:"none",cursor:"pointer",color:"#6B5E55",padding:4}}><span style={{fontFamily:"var(--mono)",fontSize:9}}>v{APP_VERSION}</span><span style={{fontSize:10}}>🔄</span></button>
      </div>

      {/* 3 Tabs */}
      <div style={S.tabs}>
        {[["scan","📷"],["count","📝"],["dashboard","📦"],["brands","🏷️"]].map(([id,icon])=>(
          <button key={id} style={{...S.tab,...(tab===id?S.tabOn:{})}} onClick={()=>setTab(id)}>{icon}<span style={{fontSize:10,fontWeight:600}}>{id[0].toUpperCase()+id.slice(1)}</span></button>
        ))}
      </div>

      {/* ═══ SCAN ═══ */}
      {tab==="scan"&&<div style={S.page}>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={addPhoto} style={{display:"none"}}/>
        {photos.length>0&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
            {photos.map((p,i)=>(
              <div key={i} style={{position:"relative",aspectRatio:"4/3",borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.08)"}}>
                <img src={p.thumb} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                <button onClick={()=>removePhoto(i)} style={{position:"absolute",top:4,right:4,width:22,height:22,borderRadius:"50%",background:"rgba(0,0,0,0.7)",border:"none",color:"#FFF",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
            ))}
          </div>
        )}
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:photos.length===0?"center":"flex-start",gap:12}}>
          {photos.length===0&&<span style={{fontSize:48}}>📷</span>}
          {photos.length<6&&<button onClick={()=>fileRef.current?.click()} disabled={scanning} style={{width:"100%",maxWidth:300,padding:photos.length===0?"18px":"12px",background:photos.length===0?"linear-gradient(135deg,var(--accent),var(--al))":"rgba(255,255,255,0.04)",border:photos.length===0?"none":"1px solid rgba(255,255,255,0.1)",borderRadius:14,color:photos.length===0?"#FFF":"#EDE5DD",fontSize:photos.length===0?16:14,fontWeight:700,cursor:"pointer",minHeight:photos.length===0?56:44}}>📸 {photos.length===0?"Take Photo":`Add Photo (${photos.length}/6)`}</button>}
          {photos.length>0&&<button onClick={processAllPhotos} disabled={scanning} style={{width:"100%",maxWidth:300,padding:"18px",background:"linear-gradient(135deg,var(--accent),var(--al))",border:"none",borderRadius:14,color:"#FFF",fontSize:16,fontWeight:700,cursor:"pointer",minHeight:56,opacity:scanning?.5:1}}>{scanning?"🔍 Analyzing...":"⊙ Scan All"}</button>}
          {photos.length>0&&!scanning&&<button onClick={()=>setPhotos([])} style={{fontFamily:"var(--mono)",fontSize:10,color:"#E74C3C",background:"none",border:"none",cursor:"pointer"}}>Clear photos</button>}
        </div>
        {error&&<div style={S.err}>⚠️ {error}</div>}

        {/* Scan Results */}
        {results&&(
          <div style={{marginTop:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontFamily:"var(--mono)",fontSize:10,color:"#8B7B72",textTransform:"uppercase",letterSpacing:1.5}}>Scan Results</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setResults(null)} style={{fontFamily:"var(--mono)",fontSize:10,color:"#E74C3C",background:"rgba(231,76,60,0.08)",border:"1px solid rgba(231,76,60,0.2)",borderRadius:6,padding:"4px 10px",cursor:"pointer"}}>✕</button>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10,border:"1px solid rgba(255,255,255,0.05)",marginBottom:8}}>
              <span style={{fontFamily:"var(--mono)",fontSize:10,color:"#8B7B72"}}>Total found</span>
              <span style={{fontFamily:"var(--mono)",fontSize:22,fontWeight:700,color:"var(--al)"}}>{results.total}</span>
            </div>
            {results.categories.map((g,gi)=>(
              <div key={gi} style={{marginBottom:8}}>
                <div style={{fontFamily:"var(--mono)",fontSize:10,color:"#8B7B72",marginBottom:4}}>{g.category} ({g.subtotal})</div>
                {g.items.map((item,ii)=>(
                  <div key={ii} style={{display:"flex",alignItems:"center",padding:"8px 10px",background:"rgba(255,255,255,0.02)",borderLeft:"3px solid rgba(255,255,255,0.1)",marginBottom:2}}>
                    <span style={{flex:1,fontSize:13,fontWeight:600,color:"#EDE5DD"}}>{item.product}</span>
                    <span style={{fontFamily:"var(--mono)",fontSize:18,fontWeight:700,color:"var(--al)"}}>{item.count}</span>
                  </div>
                ))}
              </div>
            ))}
            <button onClick={()=>{
              const now=new Date();
              const date=now.toLocaleDateString("en-US",{month:"short",day:"numeric"});
              const time=now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
              let text=`Fridge scan — ${date}, ${time}\n\n`;
              results.categories.forEach(g=>{
                text+=`${g.category} (${g.subtotal})\n`;
                g.items.forEach(i=>{text+=`  ${i.product} — ${i.count}\n`;});
                text+=`\n`;
              });
              text+=`Total: ${results.total} items`;
              if(navigator.share){navigator.share({title:"AberScan",text}).catch(()=>{});}
              else{try{navigator.clipboard.writeText(text);alert("Copied");}catch{}}
            }} style={{width:"100%",padding:"14px",background:"linear-gradient(135deg,var(--accent),var(--al))",border:"none",borderRadius:12,color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer",minHeight:48,marginTop:4}}>💬 Text Results</button>
          </div>
        )}
      </div>}

      {/* ═══ COUNT ═══ */}
      {tab==="count"&&<div style={S.page}>
        {/* Product list with count inputs */}
        {parList.length>0&&<div style={{display:"flex",flexDirection:"column",gap:3}}>
          {parList.map((p,i)=>{
            const count=counts[p.name]||0;
            const level=count>0?getStockLevel(count,p.par):null;
            const sl=level?STOCK_LEVELS[level]:null;
            const tier=VOLUME_TIERS[p.volume]||VOLUME_TIERS.med;
            return(
              <div key={i} style={{display:"flex",alignItems:"center",padding:"10px 8px",gap:8,borderLeft:`3px solid ${sl?sl.border:"rgba(255,255,255,0.06)"}`,background:sl?sl.bg:"transparent"}}>
                <button onClick={()=>removeProduct(i)} style={{background:"none",border:"none",color:"#444",fontSize:12,cursor:"pointer",padding:2,flexShrink:0}}>✕</button>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#EDE5DD",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                  <div style={{display:"flex",gap:4,marginTop:2}}>
                    <span style={{fontSize:9,background:tier.bg,color:tier.color,padding:"1px 5px",borderRadius:3,fontWeight:600}}>{tier.label}</span>
                    <span style={{fontFamily:"var(--mono)",fontSize:9,color:"#6B5E55"}}>par {p.par}</span>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                  <button onClick={()=>setCounts(prev=>{const n={...prev,[p.name]:Math.max(0,(prev[p.name]||0)-1)};return n;})} style={{width:32,height:32,borderRadius:8,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"#8B7B72",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                  <input type="number" inputMode="numeric" value={count||""} onChange={e=>{const v=parseInt(e.target.value);setCounts(prev=>({...prev,[p.name]:isNaN(v)?0:Math.max(0,v)}));}} placeholder="0" style={{width:52,height:32,textAlign:"center",background:"rgba(255,255,255,0.06)",border:`1px solid ${sl?sl.border+"60":"rgba(255,255,255,0.1)"}`,borderRadius:8,color:sl?sl.color:"#8B7B72",fontFamily:"var(--mono)",fontSize:16,fontWeight:700,outline:"none"}}/>
                  <button onClick={()=>setCounts(prev=>({...prev,[p.name]:(prev[p.name]||0)+1}))} style={{width:32,height:32,borderRadius:8,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"#8B7B72",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                </div>
              </div>
            );
          })}
        </div>}

        {/* Add product inline */}
        {adding?(
          <div style={{padding:12,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,marginTop:8}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Product name" autoFocus onKeyDown={e=>{if(e.key==="Enter"&&newName.trim())addProduct();}} style={{width:"100%",padding:"10px 12px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:"var(--text)",fontSize:14,outline:"none",marginBottom:8}}/>
            <div style={{display:"flex",gap:4,marginBottom:8}}>
              {["high","med","low"].map(v=>{const t=VOLUME_TIERS[v];return(
                <button key={v} onClick={()=>{if(v!==newVol){setNewVol(v);setNewPar(String(t.par));}}} style={{flex:1,padding:"6px",borderRadius:6,fontSize:10,fontWeight:600,cursor:"pointer",background:newVol===v?t.bg:"transparent",border:newVol===v?`1px solid ${t.color}40`:"1px solid rgba(255,255,255,0.06)",color:newVol===v?t.color:"#6B5E55"}}>{t.label}</button>
              );})}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <span style={{fontSize:11,color:"#8B7B72"}}>Par:</span>
              <input type="number" inputMode="numeric" value={newPar} onChange={e=>setNewPar(e.target.value)} style={{width:50,padding:"6px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,color:"var(--text)",fontFamily:"var(--mono)",fontSize:14,fontWeight:700,outline:"none",textAlign:"center"}}/>
              <div style={{flex:1}}/>
              <button onClick={()=>{setAdding(false);setNewName("");}} style={{padding:"6px 12px",background:"none",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,color:"#8B7B72",fontSize:12,cursor:"pointer"}}>Cancel</button>
              <button onClick={addProduct} style={{padding:"6px 12px",background:"var(--accent)",border:"none",borderRadius:6,color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer"}}>Add</button>
            </div>
          </div>
        ):(
          <button onClick={()=>setAdding(true)} style={{width:"100%",padding:"10px",background:"none",border:"1px dashed rgba(255,255,255,0.1)",borderRadius:10,color:"#6B5E55",fontSize:12,cursor:"pointer",marginTop:8}}>+ Add product</button>
        )}
      </div>}

      {/* ═══ DASHBOARD ═══ */}
      {tab==="dashboard"&&<div style={S.page}>
        {(()=>{
          const items=parList.map(p=>({...p,count:counts[p.name]||0}));
          const counted=items.filter(i=>i.count>0);
          const low=counted.filter(i=>getStockLevel(i.count,i.par)==="low");
          const gettingLow=counted.filter(i=>getStockLevel(i.count,i.par)==="getting_low");
          const good=counted.filter(i=>getStockLevel(i.count,i.par)==="good");
          const uncounted=items.filter(i=>i.count===0);
          const total=items.reduce((s,i)=>s+i.count,0);

          if(items.length===0)return(<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}><span style={{fontSize:40}}>📦</span><span style={{color:"#667788",fontSize:14}}>No products yet</span><span style={{color:"#555",fontSize:12}}>Add products in the Count tab</span></div>);

          return(<>
            {/* Summary */}
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              <div style={{flex:1,padding:"10px",background:"rgba(226,75,74,0.08)",borderRadius:10,textAlign:"center"}}><div style={{fontFamily:"var(--mono)",fontSize:22,fontWeight:700,color:"#E24B4A"}}>{low.length}</div><div style={{fontFamily:"var(--mono)",fontSize:8,color:"#E24B4A",textTransform:"uppercase",letterSpacing:1}}>Restock</div></div>
              <div style={{flex:1,padding:"10px",background:"rgba(186,117,23,0.08)",borderRadius:10,textAlign:"center"}}><div style={{fontFamily:"var(--mono)",fontSize:22,fontWeight:700,color:"#BA7517"}}>{gettingLow.length}</div><div style={{fontFamily:"var(--mono)",fontSize:8,color:"#BA7517",textTransform:"uppercase",letterSpacing:1}}>Low</div></div>
              <div style={{flex:1,padding:"10px",background:"rgba(99,153,34,0.08)",borderRadius:10,textAlign:"center"}}><div style={{fontFamily:"var(--mono)",fontSize:22,fontWeight:700,color:"#639922"}}>{good.length}</div><div style={{fontFamily:"var(--mono)",fontSize:8,color:"#639922",textTransform:"uppercase",letterSpacing:1}}>Good</div></div>
            </div>

            {/* Lists */}
            {[{title:"Restock now",items:low,sl:STOCK_LEVELS.low},{title:"Getting low",items:gettingLow,sl:STOCK_LEVELS.getting_low},{title:"Good",items:good,sl:STOCK_LEVELS.good}].map(group=>{
              if(group.items.length===0)return null;
              return(<div key={group.title} style={{marginBottom:14}}>
                <div style={{fontFamily:"var(--mono)",fontSize:10,fontWeight:700,color:group.sl.color,textTransform:"uppercase",letterSpacing:1.2,marginBottom:6}}>{group.title}</div>
                {group.items.map(i=>(
                  <div key={i.name} style={{display:"flex",alignItems:"center",padding:"10px",background:group.sl.bg,borderLeft:`3px solid ${group.sl.border}`,marginBottom:3}}>
                    <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,color:"#EDE5DD"}}>{i.name}</div></div>
                    <div style={{textAlign:"right"}}><span style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:700,color:group.sl.color}}>{i.count}</span><span style={{fontFamily:"var(--mono)",fontSize:10,color:"#8B7B72"}}> /{i.par}</span></div>
                  </div>
                ))}
              </div>);
            })}

            {uncounted.length>0&&<div style={{marginBottom:14}}>
              <div style={{fontFamily:"var(--mono)",fontSize:10,color:"#6B5E55",textTransform:"uppercase",letterSpacing:1.2,marginBottom:6}}>Not counted ({uncounted.length})</div>
              {uncounted.map(i=><div key={i.name} style={{padding:"6px 10px",color:"#6B5E55",fontSize:12}}>{i.name}</div>)}
            </div>}

            <button onClick={shareText} style={{width:"100%",padding:"14px",background:"linear-gradient(135deg,var(--accent),var(--al))",border:"none",borderRadius:12,color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer",minHeight:48}}>💬 Text Results</button>
          </>);
        })()}
      </div>}

      {/* ═══ BRANDS ═══ */}
      {tab==="brands"&&<div style={S.page}>
        <input ref={auditFileRef} type="file" accept="image/*" capture="environment" onChange={doAuditScan} style={{display:"none"}}/>

        {/* Brand list */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontFamily:"var(--mono)",fontSize:10,color:"#8B7B72",textTransform:"uppercase",letterSpacing:1.5}}>My Brands ({brands.length})</span>
          <button onClick={()=>setAddingBrand(true)} style={{padding:"6px 12px",background:"var(--accent)",border:"none",borderRadius:8,color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Add</button>
        </div>

        {addingBrand&&(
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <input value={brandName} onChange={e=>setBrandName(e.target.value)} placeholder="Brand name" autoFocus onKeyDown={e=>{if(e.key==="Enter")addBrand();}} style={{flex:1,padding:"10px 12px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:"var(--text)",fontSize:14,outline:"none"}}/>
            <button onClick={addBrand} style={{padding:"10px 14px",background:"var(--accent)",border:"none",borderRadius:8,color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer"}}>Save</button>
            <button onClick={()=>{setAddingBrand(false);setBrandName("");}} style={{padding:"10px",background:"none",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,color:"#8B7B72",fontSize:12,cursor:"pointer"}}>✕</button>
          </div>
        )}

        {brands.length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            {brands.map((b,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8}}>
                <span style={{fontSize:13,color:"#EDE5DD"}}>{b}</span>
                <button onClick={()=>removeBrand(i)} style={{background:"none",border:"none",color:"#6B5E55",fontSize:12,cursor:"pointer"}}>✕</button>
              </div>
            ))}
          </div>
        )}

        {/* Scan button */}
        <button onClick={()=>auditFileRef.current?.click()} disabled={auditScanning||brands.length===0} style={{width:"100%",padding:"16px",background:brands.length>0?"linear-gradient(135deg,var(--accent),var(--al))":"rgba(255,255,255,0.04)",border:"none",borderRadius:14,color:brands.length>0?"#FFF":"#6B5E55",fontSize:15,fontWeight:700,cursor:"pointer",minHeight:52,opacity:auditScanning?.5:1,marginBottom:14}}>
          {auditScanning?"🔍 Scanning shelf...":"📸 Scan Bar Shelf"}
        </button>

        {/* Audit Results */}
        {auditResults&&(
          <>
            {/* Found */}
            {auditResults.found&&auditResults.found.length>0&&(
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"var(--mono)",fontSize:10,fontWeight:700,color:"#2ECC71",textTransform:"uppercase",letterSpacing:1.2,marginBottom:6}}>Found ({auditResults.found.length})</div>
                {auditResults.found.map((f,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",padding:"10px",background:"rgba(46,204,113,0.06)",borderLeft:"3px solid #2ECC71",marginBottom:3}}>
                    <span style={{fontSize:16,marginRight:8}}>✅</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:600,color:"#EDE5DD"}}>{f.brand}</div>
                      {f.notes&&<div style={{fontSize:11,color:"#8B7B72",marginTop:2}}>{f.notes}</div>}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Not found */}
            {auditResults.not_found&&auditResults.not_found.length>0&&(
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"var(--mono)",fontSize:10,fontWeight:700,color:"#E24B4A",textTransform:"uppercase",letterSpacing:1.2,marginBottom:6}}>Not Found ({auditResults.not_found.length})</div>
                {auditResults.not_found.map((b,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",padding:"10px",background:"rgba(226,75,74,0.06)",borderLeft:"3px solid #E24B4A",marginBottom:3}}>
                    <span style={{fontSize:16,marginRight:8}}>❌</span>
                    <span style={{fontSize:14,fontWeight:600,color:"#EDE5DD"}}>{b}</span>
                  </div>
                ))}
              </div>
            )}

            {/* Shelf Share */}
            {(()=>{
              const allBrands=auditResults.all_brands||[...(auditResults.found||[]).map(f=>f.brand),...(auditResults.other_brands||[])];
              if(allBrands.length===0)return null;
              const shares=calcShelfShare(allBrands);
              const SHARE_COLORS=["#E24B4A","#BA7517","#3498DB","#2ECC71","#9B59B6","#E67E22","#1ABC9C","#E74C3C","#95A5A6"];
              return(
                <div style={{marginBottom:12}}>
                  <div style={{fontFamily:"var(--mono)",fontSize:10,fontWeight:700,color:"#EDE5DD",textTransform:"uppercase",letterSpacing:1.2,marginBottom:8}}>📊 Shelf Share</div>
                  {/* Bar visualization */}
                  <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",marginBottom:8}}>
                    {shares.map((s,i)=>(
                      <div key={i} style={{width:`${s.pct}%`,background:SHARE_COLORS[i%SHARE_COLORS.length],minWidth:s.pct>0?2:0}}/>
                    ))}
                  </div>
                  {shares.map((s,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",padding:"8px 0",borderBottom:i<shares.length-1?"1px solid rgba(255,255,255,0.04)":"none"}}>
                      <div style={{width:10,height:10,borderRadius:2,background:SHARE_COLORS[i%SHARE_COLORS.length],marginRight:8,flexShrink:0}}/>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:600,color:"#EDE5DD"}}>{s.name}</div>
                        <div style={{fontSize:10,color:"#8B7B72",marginTop:1}}>{s.brands.join(", ")}</div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <span style={{fontFamily:"var(--mono)",fontSize:16,fontWeight:700,color:SHARE_COLORS[i%SHARE_COLORS.length]}}>{s.pct}%</span>
                        <div style={{fontFamily:"var(--mono)",fontSize:9,color:"#8B7B72"}}>{s.count} bottle{s.count!==1?"s":""}</div>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Text results */}
            <button onClick={()=>{
              const now=new Date();
              const date=now.toLocaleDateString("en-US",{month:"short",day:"numeric"});
              const time=now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
              const allBrands=auditResults.all_brands||[...(auditResults.found||[]).map(f=>f.brand),...(auditResults.other_brands||[])];
              const shares=calcShelfShare(allBrands);
              let text=`Brand Audit — ${date}, ${time}\n\n`;
              if(auditResults.found?.length>0){text+=`✅ FOUND\n`;auditResults.found.forEach(f=>{text+=`  ${f.brand}${f.notes?" — "+f.notes:""}\n`;});text+=`\n`;}
              if(auditResults.not_found?.length>0){text+=`❌ NOT FOUND\n`;auditResults.not_found.forEach(b=>{text+=`  ${b}\n`;});text+=`\n`;}
              if(shares.length>0){text+=`📊 SHELF SHARE\n`;shares.forEach(s=>{text+=`  ${s.name} — ${s.pct}% (${s.count} bottle${s.count!==1?"s":""})\n`;});text+=`\n`;}
              if(navigator.share){navigator.share({title:"Brand Audit",text}).catch(()=>{});}
              else{try{navigator.clipboard.writeText(text);alert("Copied");}catch{}}
            }} style={{width:"100%",padding:"14px",background:"linear-gradient(135deg,var(--accent),var(--al))",border:"none",borderRadius:12,color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer",minHeight:48}}>💬 Text Results</button>
          </>
        )}

        {error&&tab==="brands"&&<div style={S.err}>⚠️ {error}</div>}
      </div>}
    </div>
  );
}

const S={
  root:{minHeight:"100dvh",background:"#110E0C",fontFamily:"var(--sans)",color:"#F5F0EB",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"},
  hdr:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"max(12px,env(safe-area-inset-top,12px)) 16px 4px",position:"sticky",top:0,zIndex:20,background:"#110E0C"},
  tabs:{display:"flex",padding:"0 12px 6px",gap:4,position:"sticky",top:44,zIndex:20,background:"#110E0C"},
  tab:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"8px 4px",background:"transparent",border:"1px solid transparent",borderRadius:10,color:"#6B5E55",fontFamily:"var(--sans)",cursor:"pointer",minHeight:40},
  tabOn:{background:"rgba(139,41,66,.15)",border:"1px solid rgba(139,41,66,.4)",color:"var(--al)"},
  page:{flex:1,padding:"8px 12px 32px",display:"flex",flexDirection:"column"},
  err:{marginTop:8,background:"rgba(231,76,60,.1)",border:"1px solid rgba(231,76,60,.25)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#E74C3C"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
